services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zoia
      POSTGRES_USER: zoia
      POSTGRES_PASSWORD: zoia
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoia -d zoia"]
      interval: 5s
      timeout: 5s
      retries: 10

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      - redis

  api:
    build: .
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_QUEUE_NAME: commands
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: zoia
      POSTGRES_USER: zoia
      POSTGRES_PASSWORD: zoia
      APP_ENV: local
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: python -m app.worker.main
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_QUEUE_NAME: commands
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: zoia
      POSTGRES_USER: zoia
      POSTGRES_PASSWORD: zoia
      APP_ENV: local
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

volumes:
  redisinsight-data:
  postgres-data:
