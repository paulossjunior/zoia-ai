services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_QUEUE_NAME: commands
      APP_ENV: local
    ports:
      - "8000:8000"
    depends_on:
      - redis

  worker:
    build: .
    command: python -m app.worker.main
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_QUEUE_NAME: commands
      APP_ENV: local
    depends_on:
      - redis
